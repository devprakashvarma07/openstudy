<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenStudy</title>
    <meta name="description" content="OpenStudy — student learning portal with course batches, lecture notes and bookmarks." />
    <meta property="og:title" content="OpenStudy" />
    <meta property="og:description" content="OpenStudy — student learning portal with course batches, lecture notes and bookmarks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Reddit+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Resolve theme before first paint: stored choice wins, otherwise follow system.
      try {
        var t = localStorage.getItem('os-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
